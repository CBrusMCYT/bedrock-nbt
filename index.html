<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BedrockNBT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#13995c">
<style>
:root{--bg:#eef1ee;--card:#fff;--tx:#141a17;--mut:#68736d;--line:#dde3df;--ac:#13995c;--sel:#cfeedd;--bad:#d6393f;--sh:0 10px 34px rgba(10,40,25,.16);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1311;--card:#181e1b;--tx:#e9efeb;--mut:#8a978f;--line:#26302b;--ac:#35d08a;--sel:#1d4a35;--bad:#ff6b70;--sh:0 10px 34px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1311;--card:#181e1b;--tx:#e9efeb;--mut:#8a978f;--line:#26302b;--ac:#35d08a;--sel:#1d4a35;--bad:#ff6b70;--sh:0 10px 34px rgba(0,0,0,.55);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ttl small{color:var(--mut);font-size:12px}
.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--bg);color:var(--tx);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn.pri{background:var(--ac);color:#fff}.btn.bad{color:var(--bad)}.btn:disabled{opacity:.35}
#main{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card)}
.bar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.bar input{flex:1;min-width:0}.bar .btn{background:var(--bg);padding:8px 10px;font-size:13px}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tree{flex:1;overflow:auto;padding:4px 0 10px;font:13.5px/1.3 ui-monospace,Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
.tr{display:flex;align-items:center;gap:6px;min-height:38px;padding-right:14px;cursor:pointer;white-space:nowrap;width:max-content;min-width:100%;box-sizing:border-box}
.tr.sel{background:var(--sel)}
.ar{width:18px;text-align:center;color:var(--mut);flex:none}
.ti{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font:700 10px/1 ui-monospace,Menlo,monospace;flex:none}
.tn{font-weight:700}.tv{color:var(--mut)}.tr.sel .tv{color:var(--tx)}
.tr.more{color:var(--ac);font-weight:700}
.empty{margin:auto;padding:28px;max-width:340px;text-align:center;font-family:system-ui,sans-serif}
.empty h2{margin:0 0 8px;font-size:22px}.empty p{color:var(--mut);margin:0 0 18px}
.empty .btn{padding:14px 22px;font-size:16px}
.st{padding:7px 12px;font:12px ui-monospace,Menlo,monospace;color:var(--mut);border-top:1px solid var(--line);background:var(--card);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-top:1px solid var(--line)}
.tb .btn{flex:1;padding:11px 4px}
.st[hidden],.tb[hidden],#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.pn{position:relative;width:100%;max-height:88%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh)}
.pn h3{margin:0 0 12px;font-size:18px}.pn label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}.pn p{margin:0;color:var(--mut)}
.ac{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.pn details{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.pn summary{font-weight:700;cursor:pointer}.pn .hint{color:var(--mut)}
.inv{border-color:var(--bad)!important;color:var(--bad)!important}
.err{color:var(--bad);font-size:13px;margin-top:4px}.err:empty{display:none}
.pn .hint{font-size:13px;margin-top:6px}.pn .guide{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px}
.pn .pre{color:var(--ac);font:600 13px ui-monospace,Menlo,monospace;margin-top:10px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:88%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="ttl"><b id="fn">BedrockNBT</b><small id="fi">Editor tag Minecraft</small></div>
    <button class="btn" id="open">Buka</button>
    <button class="btn" id="undo">Urungkan</button>
    <button class="btn pri" id="save">Simpan</button>
  </div>
  <div id="main"></div>
  <div class="st" id="st" hidden></div>
  <div class="tb" id="tb" hidden>
    <button class="btn" id="b-edit">Edit</button>
    <button class="btn" id="b-add">Tambah</button>
    <button class="btn" id="b-item">Item+</button>
    <button class="btn" id="b-dup">Duplikat</button>
    <button class="btn bad" id="b-del">Hapus</button>
  </div>
</div>
<div id="sheet" hidden></div>
<div id="toast"></div>
<input type="file" id="file" hidden>
<input type="file" id="sfile" hidden>
<script>
const T={1:'Byte',2:'Short',3:'Int',4:'Long',5:'Float',6:'Double',7:'Byte Array',8:'String',9:'List',10:'Compound',11:'Int Array',12:'Long Array'};
const IT={1:'B',2:'S',3:'I',4:'L',5:'F',6:'D',7:'b',8:'"',9:'[]',10:'{}',11:'i',12:'l'};
const CL={1:'#c98a1e',2:'#b8741c',3:'#2b8bd6',4:'#6d55d6',5:'#1f9d78',6:'#16867f',7:'#6b7a72',8:'#d4527f',9:'#a55fd6',10:'#c9a21a',11:'#6b7a72',12:'#6b7a72'};
const ET={7:1,11:3,12:4};
const S={root:null,sel:null,open:new Set(),lim:{},le:false,comp:'none',hdr:null,fname:'',undo:[],q:'',orig:null};
const $=s=>document.querySelector(s);
const isA=t=>t==7||t==11||t==12, isC=t=>t==9||t==10;
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x=='class')e.className=a[x];else if(x.startsWith('on')||x=='value'||x=='hidden')e[x]=a[x];else e.setAttribute(x,a[x])}k.flat().forEach(c=>{if(c!=null&&c!==false)e.append(c)});return e};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}

/* ---------- parser & writer ---------- */
function parse(buf,le){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),td=new TextDecoder();let p=0;
  const need=n=>{if(p+n>buf.length)throw Error('Data terpotong')};
  const rd={1:()=>{need(1);return dv.getInt8(p++)},
    2:()=>{need(2);const v=dv.getInt16(p,le);p+=2;return v},
    3:()=>{need(4);const v=dv.getInt32(p,le);p+=4;return v},
    4:()=>{need(8);const v=dv.getBigInt64(p,le);p+=8;return v},
    5:()=>{need(4);const v=dv.getFloat32(p,le);p+=4;return v},
    6:()=>{need(8);const v=dv.getFloat64(p,le);p+=8;return v}};
  const str=()=>{need(2);const l=dv.getUint16(p,le);p+=2;need(l);const s=td.decode(buf.subarray(p,p+l));p+=l;return s};
  const cnt=()=>{const n=rd[3]();if(n<0)throw Error('Panjang tidak valid');return n};
  const arr=f=>{const n=cnt(),a=[];for(let i=0;i<n;i++)a.push(f());return a};
  function node(t){
    if(t<=6)return{t,v:rd[t]()};
    if(t==7)return{t,v:arr(rd[1])};
    if(t==8)return{t,v:str()};
    if(t==9){const lt=rd[1](),n=cnt();if(n>0&&(lt<1||lt>12))throw Error('Tipe list tidak dikenal');const v=[];for(let i=0;i<n;i++)v.push(node(lt));return{t,lt,v}}
    if(t==10){const v=[];for(;;){need(1);const ct=dv.getUint8(p++);if(ct==0)break;if(ct>12)throw Error('Tag tidak dikenal');const n=str(),c=node(ct);c.n=n;v.push(c)}return{t,v}}
    if(t==11)return{t,v:arr(rd[3])};
    if(t==12)return{t,v:arr(rd[4])};
    throw Error('Tag tidak dikenal')}
  need(1);if(dv.getUint8(p++)!=10)throw Error('Root bukan Compound');
  const n=str(),r=node(10);r.n=n;return{root:r,end:p}}
function write(root,le){
  let a=new Uint8Array(1024),dv=new DataView(a.buffer),p=0;const te=new TextEncoder();
  const g=n=>{if(p+n>a.length){const b=new Uint8Array(Math.max(a.length*2,p+n));b.set(a);a=b;dv=new DataView(a.buffer)}};
  const W={1:x=>{g(1);dv.setInt8(p++,x)},2:x=>{g(2);dv.setInt16(p,x,le);p+=2},3:x=>{g(4);dv.setInt32(p,x,le);p+=4},
    4:x=>{g(8);dv.setBigInt64(p,x,le);p+=8},5:x=>{g(4);dv.setFloat32(p,x,le);p+=4},6:x=>{g(8);dv.setFloat64(p,x,le);p+=8}};
  const ws=s=>{const e=te.encode(s);g(2+e.length);dv.setUint16(p,e.length,le);p+=2;a.set(e,p);p+=e.length};
  function wn(n){const t=n.t;
    if(t<=6)W[t](n.v);
    else if(t==7){W[3](n.v.length);n.v.forEach(x=>W[1](x))}
    else if(t==8)ws(n.v);
    else if(t==9){W[1](n.v.length?n.lt:0);W[3](n.v.length);n.v.forEach(wn)}
    else if(t==10){n.v.forEach(c=>{g(1);dv.setUint8(p++,c.t);ws(c.n);wn(c)});g(1);dv.setUint8(p++,0)}
    else if(t==11){W[3](n.v.length);n.v.forEach(x=>W[3](x))}
    else{W[3](n.v.length);n.v.forEach(x=>W[4](x))}}
  g(1);dv.setUint8(p++,10);ws(root.n);wn(root);return a.slice(0,p)}
const dec=async(u,f)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream(f))).arrayBuffer());
const enc=async(u,f)=>new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new CompressionStream(f))).arrayBuffer());

/* ---------- file ---------- */
async function openFile(f){
  try{
    const sg=new Uint8Array(await f.slice(0,2).arrayBuffer());if(sg[0]==0x50&&sg[1]==0x4b)return openWorld(f);
    const raw=new Uint8Array(await f.arrayBuffer());let u=raw,comp='none',hdr=null,off=0;
    if(u[0]==0x50&&u[1]==0x4b)throw Error('Ini file zip (.mcworld). Dukungan world menyusul di tahap berikutnya');
    if(u[0]==0x1f&&u[1]==0x8b){u=await dec(u,'gzip');comp='gzip'}
    else if(u[0]==0x78&&[1,0x5e,0x9c,0xda].includes(u[1])){u=await dec(u,'deflate');comp='deflate'}
    if(u.length>9){const d=new DataView(u.buffer,u.byteOffset);if(u[8]==10&&d.getUint32(4,true)==u.length-8&&d.getUint32(0,true)<64){hdr=d.getUint32(0,true);off=8}}
    const b=u.subarray(off);let r=null,le=false;
    for(const l of off?[true]:[false,true]){try{const x=parse(b,l);if(x.end==b.length){r=x;le=l;break}}catch(e){}}
    if(!r)throw Error('Format NBT tidak dikenali atau file rusak. File tidak diubah.');
    Object.assign(S,{w:null,wk:null,multi:false,root:r.root,sel:[],open:new Set(['']),lim:{},le,comp,hdr,fname:f.name,undo:[],q:'',orig:raw});render();
  }catch(e){toast(e.message)}}
async function dl(u,name){
  const ok='gif png jpg jpeg webp mp4 webm mov txt json md docx pptx epub csv ttf html svg pdf xlsx zip fig'.split(' ');
  const ext=((name.match(/\.([^.]+)$/)||[])[1]||'').toLowerCase();let data=u,fn=name,msg='';
  const d=window.claude?await claude.use('downloads').catch(()=>null):null;
  if(!d){const a=h('a',{href:URL.createObjectURL(new Blob([u])),download:name});document.body.append(a);a.click();a.remove();return toast('Tersimpan ke unduhan: '+name)}
  if(!ok.includes(ext)){
    if(ext=='mcworld'){fn=name+'.zip';msg=' Hapus akhiran .zip dari namanya supaya jadi .mcworld, lalu buka di Minecraft.'}
    else{data=zipBuild(new Blob([]),{co:0,cd:new Uint8Array(0),ents:[]},[{name,data:u instanceof Blob?new Uint8Array(await u.arrayBuffer()):u}],new Set());fn=name+'.zip';msg=' Ekstrak zip ini untuk mendapatkan file '+name+'.'}}
  try{await d.save({filename:fn,data});toast('Tersimpan: '+fn+'.'+msg)}
  catch(e){toast(e&&e.code=='declined'?'Penyimpanan dibatalkan':'Gagal menyimpan: '+((e&&e.message)||'tidak tersedia'))}}
async function save(){
  try{let u=write(S.root,S.le);
    if(S.hdr!=null){const o=new Uint8Array(8+u.length),d=new DataView(o.buffer);d.setUint32(0,S.hdr,true);d.setUint32(4,u.length,true);o.set(u,8);u=o}
    if(S.comp!='none')u=await enc(u,S.comp);
    await dl(u,S.fname);
  }catch(e){toast(e.message)}}


/* ---------- state ---------- */
function at(sel){let n=S.root,p=null;for(const i of sel){if(!isC(n.t)||!n.v[i])return null;p=n;n=n.v[i]}return{n,p,i:sel[sel.length-1]}}
function mut(fn){S.undo.push({r:structuredClone(S.root),sel:S.sel&&[...S.sel]});if(S.undo.length>20)S.undo.shift();fn();render()}
function undo(){const s=S.undo.pop();if(!s)return;S.root=s.r;S.sel=s.sel;render()}
const fmt=c=>isA(c.t)?c.v.join(', '):String(c.v);
function conv(t,s){
  if(t==8)return s;
  if(isA(t))return s.split(/[\s,]+/).filter(Boolean).map(y=>conv(ET[t],y));
  s=s.trim();if(s==='')s='0';
  if(t<=4){if(!/^[+-]?\d+$/.test(s))throw Error('Harus bilangan bulat');const b=BigInt(s),m=1n<<BigInt([0,8,16,32,64][t]-1);if(b<-m||b>=m)throw Error('Di luar rentang '+T[t]);return t==4?b:Number(b)}
  const x=Number(s);if(isNaN(x))throw Error('Harus berupa angka');return t==5?Math.fround(x):x}
const tv=n=>isC(n.t)?'('+n.v.length+')':isA(n.t)?': ['+n.v.length+' elemen]':n.t==8?': "'+n.v.slice(0,80)+'"':n.t==4?': '+n.v+'L':': '+n.v;

/* ---------- tree ---------- */
function hits(n,name,q){
  if(name.toLowerCase().includes(q))return true;
  if(isC(n.t))return n.v.some((c,i)=>hits(c,n.t==9?'#'+i:c.n,q));
  return !isA(n.t)&&String(n.v).toLowerCase().includes(q)}
function tree(){
  const t=$('#tree');t.replaceChildren();const q=S.q.toLowerCase();
  const walk=(n,name,sel,d)=>{
    const key=sel.join('.');if(q&&!hits(n,name,q))return;
    const open=isC(n.t)&&(q?true:S.open.has(key));
    t.append(h('div',{class:'tr'+(S.sel&&S.sel.join('.')==key?' sel':''),style:'padding-left:'+(6+d*18)+'px',onclick:()=>tap(n,sel,key)},
      h('span',{class:'ar'},isC(n.t)?(open?'\u25be':'\u25b8'):''),
      h('span',{class:'ti',style:'background:'+CL[n.t]},IT[n.t]),
      h('span',{class:'tn'},name),h('span',{class:'tv'},tv(n))));
    if(!open)return;
    const lim=S.lim[key]||200;let shown=0;
    for(let i=0;i<n.v.length;i++){
      const c=n.v[i],cn=n.t==9?'#'+i:c.n;if(q&&!hits(c,cn,q))continue;
      if(shown>=lim){t.append(h('div',{class:'tr more',style:'padding-left:'+(6+(d+1)*18)+'px',onclick:()=>{S.lim[key]=lim+500;tree()}},'... tampilkan lebih banyak ('+(n.v.length-i)+' lagi)'));break}
      shown++;walk(c,cn,[...sel,i],d+1)}};
  walk(S.root,S.root.n||'root',[],0)}
function tap(n,sel,key){
  const was=S.sel&&S.sel.join('.')==key;S.sel=sel;
  if(isC(n.t)){if(S.open.has(key))S.open.delete(key);else S.open.add(key)}
  else if(was){tree();status();return editSel()}
  tree();status()}
function status(){
  const st=$('#st'),a=S.sel&&at(S.sel),ids=['edit','add','item','dup','del'];
  if(!a){S.sel=null;st.textContent='Tidak ada tag dipilih';ids.forEach(k=>$('#b-'+k).disabled=true);return}
  let n=S.root;const names=[S.root.n||'root'];
  for(const i of S.sel){const p=n;n=n.v[i];names.push(p.t==9?'#'+i:n.n)}
  st.textContent=names.join(' > ')+'  |  '+T[a.n.t];
  const root=!a.p;
  $('#b-edit').disabled=root||(isC(a.n.t)&&a.p.t!=10);
  $('#b-add').disabled=!isC(a.n.t);$('#b-item').disabled=!(a.n.t==9&&(!a.n.v.length||a.n.lt==10));$('#b-dup').disabled=root;$('#b-del').disabled=root}
function openAll(n,sel,c){const k=sel.join('.');if(!isC(n.t)||c.n>4000)return;c.n++;S.open.add(k);n.v.forEach((x,i)=>openAll(x,[...sel,i],c))}
function render(){
  const ok=!!S.root;
  $('#fn').textContent=ok?S.fname:'BedrockNBT';
  $('#fi').textContent=ok?(S.le?'Little-endian (Bedrock)':'Big-endian (Java)')+', '+(S.comp=='none'?'tanpa kompresi':S.comp):'Editor tag Minecraft';
  $('#undo').disabled=!S.undo.length;$('#save').disabled=!(ok||S.w);$('#save').textContent=S.w?(ok?'Terapkan':'Ekspor'):'Simpan';if(S.w&&!ok){$('#fn').textContent=S.w.file.name;$('#fi').textContent='World Bedrock, '+S.w.n+' key NBT, '+(S.w.pending.size+S.w.pf.size)+' diubah'}$('#st').hidden=$('#tb').hidden=!ok;
  const m=$('#main');m.replaceChildren();
  if(S.w&&!ok){renderWorld(m);return}
  if(!ok){m.append(h('div',{class:'empty'},h('h2',{},'Buka file NBT'),
    h('p',{},'Mendukung level.dat, playerdata (.dat), .nbt, dan .mcstructure. Java dan Bedrock terdeteksi otomatis, kompresi gzip dan zlib ditangani sendiri.'),
    h('button',{class:'btn pri',onclick:()=>$('#file').click()},'Pilih file'),
    h('p',{style:'margin-top:18px;font-size:13px'},'File .mcworld (world Bedrock) juga bisa dibuka. Region .mca Java menyusul.')));return}
  m.append(h('div',{class:'bar'},
    S.wk?h('button',{class:'btn',onclick:back},'Kembali'):null,
    h('input',{placeholder:'Cari nama atau nilai tag',value:S.q,oninput:e=>{S.q=e.target.value;tree()}}),
    h('button',{class:'btn',onclick:()=>{openAll(S.root,[],{n:0});tree()}},'Buka semua'),
    h('button',{class:'btn',onclick:()=>{S.open=new Set(['']);tree()}},'Tutup'),
    S.wk?null:h('button',{class:'btn',onclick:()=>dl(S.orig,S.fname+'.bak')},'Cadangan')),
    h('div',{class:'tree',id:'tree'}));
  tree();status()}

/* ---------- aksi ---------- */
function sheet(title,body,acts){const s=$('#sheet');s.replaceChildren(h('div',{class:'bk',onclick:close}),h('div',{class:'pn'},h('h3',{},title),body,h('div',{class:'ac'},acts)));s.hidden=false}
function close(){$('#sheet').hidden=true}
const bt=(l,c,f)=>h('button',{class:'btn '+c,onclick:f},l);
function editSel(){const a=S.sel&&at(S.sel);if(a&&a.p&&!(isC(a.n.t)&&a.p.t!=10))editSheet(a.p,a.i)}
function editSheet(par,i){
  const c=par.v[i],byName=par.t==10;
  const nm=byName?h('input',{value:c.n}):null;
  const vl=isC(c.t)?null:(c.t==8||isA(c.t))?h('textarea',{rows:c.t==8?4:6,value:fmt(c)}):h('input',{value:fmt(c),inputmode:c.t>4?'decimal':'numeric'});
  const ne=h('div',{class:'err'}),ve=h('div',{class:'err'});
